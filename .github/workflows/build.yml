name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kivy/buildozer-action@v1
        with:
          filename: buildozer.spec
          android_debug: true
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          
